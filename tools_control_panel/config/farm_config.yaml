# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  map_dir:  '~/box/vln-large-scale-farm/tools_control_panel/output_glim'
  data_dir: '~/box/vln-large-scale-farm/data'

# ── Radio (Jetson <-> Local PC serial) ────────────────────────────────────────
radio:
  serial_port: '/dev/ttyTHS1'
  baud_rate: 57600

# ── Internet (Tailscale) ──────────────────────────────────────────────────────
internet:
  # Lab PC Tailscale IP — update to match your network
  lab_ws_url: 'ws://100.x.x.x:8000'

# ── Autonomous Schedule ───────────────────────────────────────────────────────
schedule:
  enabled: true
  times:
    - '11:00'
    - '16:00'
  off_days:
    # - '2025-12-25'
  waypoints: []  # Set via path editor in control panel

# ── Robot ─────────────────────────────────────────────────────────────────────
robot:
  linear_speed:   1.0
  angular_speed:  0.5
  max_linear_speed:  1.5
  min_linear_speed:  0.1
  max_angular_speed: 1.0
  min_angular_speed: 0.1

# ── Autonomous Driving Parameters ─────────────────────────────────────────────
autonomous:
  max_repeat_num:  1
  min_waypoints:   2
  position_tolerance:    0.3   # m
  orientation_tolerance: 10    # deg
  r1: [0.2, 15]
  r2: [0.5, 60]
  r3: [0.7, 360]
  t1: [0.2, 1.5]
  t2: [0.5, 3.0]
  t3: [0.8, 999]

# ── Recording ─────────────────────────────────────────────────────────────────
recording:
  zed_hz:              30
  lidar_hz:            10
  imu_hz:             100
  pairing_threshold_ms: 50
  web_stream_hz:        10
  sample_interval_sec: 300

# ── Server (Lab PC) ───────────────────────────────────────────────────────────
server:
  host:  '0.0.0.0'
  port:   8000
  ping_interval:        10
  ping_timeout:         20
  max_http_buffer_size: 100000000

# ── ROS2 (Jetson) ─────────────────────────────────────────────────────────────
ros2:
  cmd_vel_topic: '/cmd_vel'
  node_name:     'jetson_agent'

# ── System Monitor ────────────────────────────────────────────────────────────
monitor:
  update_interval: 1.0

map:
  update_interval: 0.5
