# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  map_dir:       '../output_glim'
  data_dir:      '../data'
  map_image:     'map_latest.png'
  map_state:     'map_state.json'
  paths_file:    'paths.json'
  mission_file:  'mission.json'   # start point + waypoints from path planner
  saved_map_dir: 'lab_pc/maps'     # lab PC only — cached copy of last received map

# ── Radio (Jetson <-> Local PC serial) ────────────────────────────────────────
radio:
  serial_port: '/dev/ttyTHS1'
  baud_rate: 57600
  image_width: 100
  camera: 'front'   # which camera the low-bandwidth radio view shows

# ── Internet (Tailscale, Jetson -> Lab PC) ────────────────────────────────────
# jetson1: 100.78.219.75        jetson2: 100.86.199.73        office-koala: 100.81.132.24
# hp-dragonfly: 100.90.113.122  thomas-desktop: 100.95.80.39  mx16: 100.85.157.116
# joshuas-macbook-pro: 100.126.106.37  thomass-macbook-pro: 100.110.245.111
internet:
  # lab_ws_url:          'http://100.81.132.24:8000'   # koala
  lab_ws_url:          'http://100.103.65.50:8000'   # ndsu
  pointcloud_topic:    '/glim_ros/globalmap'
  pointcloud_interval: 5.0

# ── Server (Lab PC web panel) ─────────────────────────────────────────────────
server:
  host:  '0.0.0.0'
  port:   8000
  ping_interval:        10
  ping_timeout:         20
  max_http_buffer_size: 100000000

# ── Sensor Extrinsics ────────────────────────────────────────────────────────
# Transform: LiDAR frame → robot base_link frame
# translation: [x, y, z]        metres
# rotation:    [roll, pitch, yaw]  degrees
lidar_extrinsics:
  translation: [0.0, 0.0, 0.0]
  rotation:    [0.0, 0.0, 0.0]   # 180° yaw = LiDAR mounted facing backward

# ── ROS2 ──────────────────────────────────────────────────────────────────────
ros2:
  node_name:     'jetson_agent'
  cmd_vel_topic: '/cmd_vel'
  topics:
    raw_pose:    '/glim_ros/localized_curr_pose'  # raw GLIM output — do not use directly
    pose:        '/glim_ros/localized_curr_pose'                 # extrinsic-corrected — use everywhere
    battery:     '/battery_state'
    lidar:       '/rslidar_points'
    zed_front:   '/zed_front/rgb/image_raw'
    zed_back:    '/zed_back/rgb/image_raw'
    imu:         '/xsens/imu/data'
    gps:         '/gps/fix'
    gps_status:  '/gps/rtk_status'
    entire_map:  '/glim_ros/entire_map'
    aligned_points: '/glim_ros/aligned_points' 
    trajectory:  '/glim_ros/localized_trajectory'
    ground_points: '/patchworkpp/ground'

# ══════════════════════════════════════════════════════════════════════════════
# 1. SCHEDULE CONFIG
# ══════════════════════════════════════════════════════════════════════════════
schedule:
  enabled: true
  times: []
  off_days: []

# ══════════════════════════════════════════════════════════════════════════════
# 2. AUTO-UPLOAD CONFIG
# ══════════════════════════════════════════════════════════════════════════════
upload:
  enabled: true
  ssh_user:    'evelyn'
  ssh_key:     '~/.ssh/id_rsa'
  host:        '100.x.x.x'
  remote_path: '/home/evelyn/farm_uploads/'
  sources:
    - '../data/'
    - '../output_glim/'
  station_pose:   [0.0, 0.0]
  station_radius: 1.5
  cooldown_sec:   300

# ══════════════════════════════════════════════════════════════════════════════
# 3. AUTONOMOUS DRIVING CONFIG
# ══════════════════════════════════════════════════════════════════════════════
autonomous:
  waypoints: []

  max_repeat_num:  1
  min_waypoints:   2

  position_tolerance:    0.3
  orientation_tolerance: 4

  linear_speed:      0.8
  angular_speed:     0.8

  r1: [0.08, 10]
  r2: [0.3, 20]
  r3: [0.4, 360]
  t1: [0.1, 1.0]
  t2: [0.3, 2.0]
  t3: [0.4, 999]

# ── Recording ─────────────────────────────────────────────────────────────────
recording:
  zed_hz:               30
  lidar_hz:             10
  imu_hz:              100
  pairing_threshold_ms:  50
  web_stream_hz:         10
  sample_interval_sec:  300
  # Topics written to the rosbag (allowlist). glim_ros/* intentionally excluded.
  rosbag_topics:
    - '/rslidar_points'
    - '/xsens/imu/data'
    - '/gps/fix'
    - '/gps/rtk_status'
    - '/cmd_vel'
  zed_cameras:
    - serial: 48335070
      name: front
    - serial: 49537850
      name: back
    - serial: 42174031
      name: right
    - serial: 45767562    
      name: left

# ── System Monitor ────────────────────────────────────────────────────────────
monitor:
  update_interval: 1.0

map:
  update_interval: 60

# ── Tmux Session Monitor ──────────────────────────────────────────────────────
tmux:
  session: 'vln'
  # Override per-window restart commands if needed.
  # Built-in keys: slam, map_saver, obstacle, gps, lidar, imu
  # Example override:
  #   slam:
  #     cmd: 'bash launch_files/launch_slam.sh real'
  windows: