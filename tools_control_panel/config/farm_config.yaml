camera_extrinsics:
  back:
  - -0.1
  - 0.0
  - -0.08
  front:
  - 0.1
  - 0.0
  - -0.08
  hfov_deg: 55.0
  left:
  - 0.0
  - 0.15
  - -0.15
  right:
  - 0.0
  - -0.15
  - -0.15
internet:
  lab_ws_url: http://100.103.65.50:8000
  pointcloud_interval: 5.0
  pointcloud_topic: /glim_ros/globalmap
lidar_extrinsics:
  rotation:
  - 0.0
  - 0.0
  - 0.0
  translation:
  - 0.0
  - 0.0
  - 0.0
map:
  update_interval: 3
monitor:
  update_interval: 1.0
paths:
  data_dir: ../data
  map_dir: ../output_glim
  map_image: map_latest.png
  map_state: map_state.json
  mission_file: mission.json
  paths_file: paths.json
  saved_map_dir: lab_pc/maps
radio:
  baud_rate: 57600
  camera: front
  image_width: 100
  serial_port: /dev/ttyTHS1
recording:
  imu_hz: 100
  lidar_hz: 10
  pairing_threshold_ms: 50
  rosbag_topics:
  - /rslidar_points
  - /xsens/imu/data
  - /gps/fix
  - /gps/rtk_status
  - /cmd_vel
  sample_interval_sec: 300
  web_stream_hz: 10
  zed_cameras:
  - name: front
    serial: 48335070
  - name: back
    serial: 49537850
  - name: right
    serial: 42174031
  - name: left
    serial: 45767562
  zed_hz: 30
ros2:
  cmd_vel_topic: /cmd_vel
  node_name: jetson_agent
  topics:
    aligned_points: /glim_ros/aligned_points
    battery: /battery_state
    entire_map: /glim_ros/entire_map
    gps: /gps/fix
    gps_pose: /gps_pose
    gps_status: /gps/rtk_status
    ground_points: /patchworkpp/ground
    imu: /xsens/imu/data
    lidar: /rslidar_points
    pose: /gps_pose
    raw_pose: /glim_ros/localized_curr_pose
    trajectory: /glim_ros/localized_trajectory
    zed_back: /zed_back/rgb/image_raw
    zed_front: /zed_front/rgb/image_raw
schedule:
  enabled: true
  off_days: []
  times: []
server:
  host: 0.0.0.0
  max_http_buffer_size: 100000000
  ping_interval: 10
  ping_timeout: 20
  port: 8000
tmux:
  session: vln
  windows: null
upload:
  cooldown_sec: 300
  enabled: true
  host: 100.x.x.x
  remote_path: /home/evelyn/farm_uploads/
  sources:
  - ../data/
  - ../output_glim/
  ssh_key: ~/.ssh/id_rsa
  ssh_user: evelyn
  station_pose:
  - 0.0
  - 0.0
  station_radius: 1.5
vlm:
  api_key: ''
  backend: ollama
  interval_sec: 120.0
  keep_alive: 10m
  model: qwen2.5vl:7b
  ollama_url: http://localhost:11434
  timeout_sec: 150.0
yolo:
  classes:
  - utility box
  - truck
  conf_threshold: 0.17
  input_size: 640
  interval_sec: 2.0
  model: yolov8s-worldv2.pt
