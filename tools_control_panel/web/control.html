<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Farm Robot Control</title>
  <script src="https://cdn.socket.io/3.1.3/socket.io.min.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    #col-cameras {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      padding: 2px 2px;
      box-sizing: border-box;
      gap: 2px;
      flex-shrink: 0;          /* never squash other columns */
      max-width: 340px;        /* hard cap so images don't dominate the bar */
    }
    #col-cameras-imgs {
      display: flex;
      align-items: stretch;
      gap: 2px;
      flex: 1;
      min-height: 0;
      overflow: hidden;        /* clip if images somehow overflow */
    }
    #col-cameras-imgs img {
      max-height: 100%;
      width: auto;
      object-fit: contain;
      display: block;
      flex-shrink: 1;
    }
    #col-cameras-ctrl {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      line-height: 1;
    }

    #sensor-status-bar {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.45);
      padding: 3px 10px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #rgb-image.radio-mode { image-rendering: pixelated; }

    /* ── Column 1A: System info (12pt) ───────────────────────── */
    #col-sys {
      min-width: 120px;
      font-size: 12pt;
      gap: 5px;
      flex-shrink: 0;   /* keep WiFi/CPU/Batt visible at all times */
    }
    .sys-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      line-height: 1.5;
      white-space: nowrap;
    }
    .sys-lbl {
      color: rgba(255,255,255,0.45);
      flex-shrink: 0;
      min-width: 44px;
    }

    /* ── Column 1B: Radio + GPS (10pt default) ───────────────── */
    #col-radio-gps {
      min-width: 170px;
      font-size: 10pt;
      gap: 3px;
      flex-shrink: 0;
    }
    .sec-divider-hdr {
      font-size: 9pt;
      color: white;
      font-weight: 600;
      text-align: center;
      width: 100%;
      margin: 4px 0 2px;
    }

    /* Radio grid: two columns side by side */
    .radio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px 16px;
      width: 100%;
    }
    .radio-grid-lbl {
      color: rgba(255,255,255,0.45);
      font-size: 9pt;
    }
    .radio-score {
      font-size: 11pt;
      font-weight: 700;
    }

    /* GPS sub-section */
    .gps-mode-badge {
      display: inline-block;
      font-size: 14px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 5px;
      letter-spacing: 0.4px;
      margin-top: 1px;
    }
    .gps-fixed { background: rgba(255,255,255,0.22);    color: #b0faf6; border: 1px solid rgba(164,255,243,0.4); }
    .gps-float { background: rgba(228,236,243,0.18);    color: #6a91b6; border: 1px solid rgba(60,160,255,0.4); }
    .gps-dgps  { background: rgba(255,190,40,0.18);     color: #b8ae97; border: 1px solid rgba(224,216,197,0.4); }
    .gps-nofix { background: rgba(255,70,70,0.15);      color: #8d7676; border: 1px solid rgba(214,174,174,0.3); }

    /* Small coordinate values (6pt) */
    .gps-coord {
      font-size: 6pt;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      font-family: monospace;
    }
    .lbl { color: rgba(255,255,255,0.38); }

    /* Base line: inherits default size for "Base Fixed" label */
    #gps-base-line {
      color: rgba(255,255,255,0.7);
      line-height: 1.5;
    }

    /* ── Safety Checker Widget ───────────────────────────────── */
    #col-safety {
      align-self: stretch;
      display: flex;
      align-items: center;
      padding: 3px 2px;
      box-sizing: border-box;
    }
    #sc-svg {
      height: 100%;
      aspect-ratio: 1 / 1;
      display: block;
    }
    .sc-wedge { fill: rgba(255,255,255,0.08); transition: fill 0.2s; }
    .sc-wedge.sc-red    { fill: rgba(255,60,60,0.85); }
    .sc-wedge.sc-yellow { fill: rgba(255,200,0,0.85); }
    .sc-wedge.sc-green  { fill: rgba(50,200,50,0.85); }
    #col-controls { min-width: 145px; gap: 7px; flex-shrink: 0; }
    .run-row { display: flex; gap: 6px; align-items: center; }
    .rec-row { display: flex; gap: 6px; align-items: center; }

    /* ── Column 3: Schedule ──────────────────────────────────── */
    #col-schedule {
      min-width: 190px;
      gap: 0;
      padding-right: 6px;
      flex-shrink: 0;
    }
    #upcoming-next {
      font-size: 12pt;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      line-height: 1.4;
      white-space: nowrap;
    }
    #upcoming-countdown {
      font-size: 12pt;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      margin-bottom: 5px;
    }
    .upcoming-item {
      font-size: 10pt;
      color: rgba(255,255,255,0.6);
      line-height: 1.7;
      white-space: nowrap;
    }
    #sched-enabled-row {
      font-size: 9px;
      color: rgba(255,255,255,0.3);
      margin-top: 4px;
    }
    #sched-enabled-row span {
      cursor: pointer;
      color: rgba(100,180,255,0.7);
      text-decoration: underline;
    }

    /* ── Column 4: Process Status (10pt everything) ──────────── */
    #col-tmux {
      min-width: 155px;
      gap: 4px;
      font-size: 10pt;
      flex-shrink: 0;
    }
    .col-proc-title {
      font-size: 10pt;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    .tmux-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10pt;
    }
    .tmux-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tdot-ok   { background: #00d26e; }
    .tdot-fail { background: #ff5050; box-shadow: 0 0 4px rgba(255,80,80,0.6); }
    .tdot-unkn { background: rgba(255,255,255,0.2); }
    .tmux-lbl  { flex: 1; color: rgba(255,255,255,0.7); font-size: 10pt; }
    .tmux-btn  {
      font-size: 10pt;
      padding: 1px 5px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18);
      color: rgba(255,255,255,0.5);
      border-radius: 3px;
      cursor: pointer;
      line-height: 1.4;
    }
    .tmux-btn:hover { background: rgba(255,255,255,0.15); color: white; }

    #estop-badge { font-size: 12pt; font-weight: 700; }
  </style>
</head>
<body>

  <div id="map-konva-container"></div>

  <div id="top-panel">

    <div id="sensor-status-bar">

      <!-- Col 1: Safety Checker -->
      <div id="col-safety">
      <!-- Safety checker SVG: forward=up, 8 wedge zones × 3 bands -->
      <svg id="sc-svg" viewBox="-1 -1 2 2" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- clip to circle for clean outer edge -->
          <clipPath id="sc-clip"><circle cx="0" cy="0" r="0.95"/></clipPath>
        </defs>
        <g clip-path="url(#sc-clip)" id="sc-zones"></g>
        <!-- Robot body square: ±0.30 of 1.0 unit = ±0.30 -->
        <rect x="-0.30" y="-0.30" width="0.60" height="0.60"
              fill="#888" stroke="rgba(255,255,255,0.5)" stroke-width="0.02"/>
        <!-- Forward arrow -->
        <polygon points="0,-0.18 0.08,-0.04 -0.08,-0.04"
                 fill="white" opacity="0.9"/>
      </svg>
      </div>

      <!-- Col 2: Radio camera stream (back camera, low-bandwidth) -->
      <div id="col-cameras">
        <div id="col-cameras-imgs">
          <img id="rgb-image" class="radio-mode" alt="Radio" />
        </div>
        <div id="col-cameras-ctrl">
          <span style="font-size:10px;color:rgba(255,255,255,0.6);">📡 Radio</span>
          <span id="info-sensors">—</span>
        </div>
      </div>

        <div class="col-divider"></div>

    <!-- Column 1A: System (12pt) -->
    <div class="panel-col" id="col-sys">
      <a href="/path_plan.html" class="util-btn" style="text-decoration:none;font-size:12pt;">🗺 Plan Path</a>
      <div class="sys-row">
        <span class="sys-lbl">WiFi</span>
        <span id="info-wifi">—</span>
      </div>
      <div class="sys-row" id="net-status-row" title="Network TX/RX per interface">
        <span class="sys-lbl">Net</span>
        <span id="info-net">—</span>
      </div>
      <div class="sys-row">
        <span class="sys-lbl">CPU</span>
        <span id="info-cpu">—</span>
      </div>
      <div class="sys-row">
        <span class="sys-lbl">Batt</span>
        <span id="info-battery">—</span>
      </div>
      <div class="sys-row">
        <span class="sys-lbl">Mode</span>
        <span id="info-mode">—</span>
        &nbsp;<span id="estop-badge">🟢</span>
        <button id="btn-clear-estop" class="util-btn" onclick="clearEstop()"
                title="Release E-STOP so manual driving works again">Clear E-Stop</button>
      </div>
    </div>

    <div class="col-divider"></div>

    <!-- Column 1B: Radio + GPS (10pt default) -->
    <div class="panel-col" id="col-radio-gps">

      <div class="sec-divider-hdr">── RADIO ──</div>
      <div class="radio-grid">
        <span class="radio-grid-lbl">Local PC</span>
        <span class="radio-grid-lbl">GPS Base</span>
        <span class="radio-score" id="score-radio">—</span>
        <span class="radio-score" id="score-gnss">—</span>
        <span class="radio-grid-lbl" style="font-size:8px;color:rgba(255,255,255,0.3);">one-way</span>
        <span class="radio-grid-lbl" style="font-size:8px;color:rgba(255,255,255,0.3);"></span>
        <span style="font-size:9pt;color:rgba(255,255,255,0.5);" id="radio-delay">—</span>
      </div>

      <div class="sec-divider-hdr">── GPS ──</div>
      <span id="gps-mode-badge" class="gps-mode-badge gps-nofix">No Fix</span>
      <div id="gps-base-line">Base —</div>
      <div style="color:rgba(255,255,255,0.65);line-height:1.5;">
        SV: <span id="gps-sv">—</span>&nbsp;&nbsp;HDOP: <span id="gps-hdop">—</span>
      </div>
      <div class="gps-coord">
        <span class="lbl">Lat </span><span id="gps-lat">—</span>
        &nbsp;<span class="lbl">Lon </span><span id="gps-lon">—</span>
        &nbsp;<span class="lbl">Alt </span><span id="gps-alt">—</span>
      </div>

    </div>

    <div class="col-divider"></div>

    <!-- Column 2: Controls -->
    <div class="panel-col" id="col-controls">

      <div style="height:6px;"></div>

      <div class="rec-row">
        <span class="sysmon-label" style="font-size:11px;">Rec</span>
        <span id="recordingStatus" class="rec-status">Stopped</span>
      </div>
      <div class="rec-row">
        <input id="dirnameInput" type="text" placeholder="directory name" style="font-size:11px;" />
        <span id="dirnameDisplay" style="display:none;font-size:12px;color:rgba(255,255,255,0.85);"></span>
      </div>
      <div class="rec-row">
        <button id="btn-rec-start" onclick="startRecording()">Start</button>
        <button id="btn-rec-stop"  onclick="stopRecording()" style="display:none;">Stop</button>
      </div>

      <div style="height:8px;"></div>

      <div class="run-row">
        <button id="autoButton" onclick="runNow()"
                style="padding:5px 10px;font-size:13px;">&#x25B6; Run Now</button>
      </div>
      <div class="run-row" style="margin-top:4px;">
        <button onclick="emergencyStop()"
                style="background:#cc0000;color:#fff;font-weight:bold;padding:5px 10px;font-size:13px;width:100%;">
          &#x1F6D1; E-STOP
        </button>
      </div>

    </div>

    <div class="col-divider"></div>

    <!-- Column 3: Schedule -->
    <div class="panel-col" id="col-schedule">
      <div id="upcoming-next">—</div>
      <div id="upcoming-countdown">—</div>
      <div id="upcoming-list"></div>
      <div id="sched-enabled-row">
        Schedule: <span onclick="toggleScheduleEnabled()" id="sched-enabled-lbl">ON</span>
      </div>
    </div>

    <div class="col-divider"></div>

    <!-- Column 4: Process Status (10pt) -->
    <div class="panel-col" id="col-tmux">
      <div class="col-proc-title">Process Status</div>
      <div id="tmux-rows"></div>
    </div>

  </div>

  <div id="robot-status"></div>

  <!-- Bottom RGB streaming bar: shown only when internet is available -->
  <div id="rgb-stream-bar">
    <div class="rgb-cam"><span class="rgb-cam-label">Left</span><img  id="left-rgb-image"  alt="Left"  /></div>
    <div class="rgb-cam"><span class="rgb-cam-label">Front</span><img id="front-rgb-image" alt="Front" /></div>
    <div class="rgb-cam"><span class="rgb-cam-label">Right</span><img id="right-rgb-image" alt="Right" /></div>
    <div class="rgb-cam"><span class="rgb-cam-label">Back</span><img  id="back-rgb-image"  alt="Back"  /></div>
  </div>

  <script src="schedule.js"></script>
  <script src="control.js"></script>
</body>
</html>
