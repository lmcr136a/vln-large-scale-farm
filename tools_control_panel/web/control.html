<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Farm Robot Control</title>
  <script src="https://cdn.socket.io/3.1.3/socket.io.min.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Schedule calendar */
    #col-schedule { min-width:220px; }
    #upcoming-label {
      font-size:15px; color:white; font-weight:600;
      margin-bottom:6px; white-space:nowrap;
    }
    .sched-table { border-collapse:collapse; font-size:8pt; }
    .sched-table th, .sched-table td {
      border:1px solid rgba(255,255,255,0.15);
      padding:2px 5px; text-align:center;
      color:rgba(255,255,255,0.7);
    }
    .sched-table th { color:rgba(255,255,255,0.45); font-weight:normal; }
    .sched-table .sched-time { color:rgba(255,255,255,0.4); font-size:7pt; }
    .sched-table .sched-cell { cursor:pointer; }
    .sched-table .sched-cell.active { color:#7cf; font-weight:bold; }
    .sched-table .sched-cell:hover { background:rgba(255,255,255,0.08); }
    /* Controls column */
    #col-controls { min-width:140px; }
    .run-row { display:flex; gap:6px; align-items:center; }
  </style>
</head>
<body>

  <div id="map-konva-container"></div>

  <div id="top-panel">

    <!-- Back camera -->
    <div class="panel-col" id="col-back">
      <img id="back-rgb-image" alt="Back camera" />
    </div>

    <!-- Front camera -->
    <div class="panel-col" id="col-front">
      <img id="rgb-image" alt="Front camera" />
    </div>

    <div class="col-divider"></div>

    <!-- System status -->
    <div class="panel-col" id="col-sysmon">
      <div class="sysmon-row"><span class="sysmon-label">WiFi</span><span id="info-wifi">—</span></div>
      <div class="sysmon-row"><span class="sysmon-label">CPU</span><span id="info-cpu">—</span></div>
      <div class="sysmon-row"><span class="sysmon-label">SSD</span><span id="info-ssd">—</span></div>
      <div class="sysmon-row"><span class="sysmon-label">Battery</span><span id="info-battery">—</span></div>
      <div class="sysmon-row"><span class="sysmon-label">Mode</span><span id="info-mode">—</span></div>
      <div class="sysmon-row"><span id="estop-indicator" style="font-weight:bold;letter-spacing:1px;">🟢 OK</span></div>
      <div class="sysmon-row" style="font-size:11px;color:rgba(255,255,255,0.7);"><span id="info-sensors">—</span></div>
    </div>

    <div class="col-divider"></div>

    <!-- Combined controls: Plan Path / Recording / Drive -->
    <div class="panel-col" id="col-controls">
      <a href="/path_plan.html" class="util-btn" style="text-decoration:none;">🗺 Plan Path</a>

      <div style="height:10px;"></div>

      <div class="rec-row">
        <span class="sysmon-label">Recording</span>
        <span id="recordingStatus" class="rec-status">Stopped</span>
      </div>
      <div class="rec-row">
        <input id="dirnameInput" type="text" placeholder="directory name" />
        <span id="dirnameDisplay" style="display:none;font-size:14px;color:rgba(255,255,255,0.85);"></span>
      </div>
      <div class="rec-row">
        <button id="btn-rec-start" onclick="startRecording()">Start</button>
        <button id="btn-rec-stop"  onclick="stopRecording()" style="display:none;">Stop</button>
      </div>

      <div style="height:10px;"></div>

      <div class="run-row">
        <button id="autoButton" onclick="runNow()" style="padding:5px 10px;font-size:13px;">▶ Run Now</button>
        <button onclick="emergencyStop()"
                style="background:#cc0000;color:#fff;font-weight:bold;padding:5px 10px;font-size:13px;">🛑 E-STOP</button>
      </div>
    </div>

    <div class="col-divider"></div>

    <!-- Weekly schedule -->
    <div class="panel-col" id="col-schedule">
      <div id="upcoming-label">Loading schedule…</div>
      <div style="margin-bottom:4px;font-size:11px;color:rgba(255,255,255,0.4);">
        Schedule:
        <span id="sched-enabled-lbl" onclick="toggleScheduleEnabled()"
              style="cursor:pointer;color:#7cf;">ON</span>
      </div>
      <div id="weekly-calendar"></div>
    </div>

  </div>

  <div id="robot-status"></div>

  <div id="controls">
    <b>↑↓←→</b>: Move &nbsp;|&nbsp;
    <b>&lt;/&gt;</b>: Linear spd &nbsp;|&nbsp;
    <b>[/]</b>: Angular spd
  </div>

  <script src="schedule.js"></script>
  <script src="control.js"></script>
</body>
</html>
