<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Path Planner</title>
  <script src="https://cdn.socket.io/3.1.3/socket.io.min.js"></script>
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    #planner-panel {
      position: fixed;
      top: 0; left: 0; width: 100%;
      display: flex; flex-direction: row;
      align-items: center; gap: 12px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.72);
      z-index: 10;
      flex-wrap: wrap;
    }
    .mode-btn { padding: 5px 13px; font-size: 13px; }
    .mode-btn.active {
      background: rgba(0,160,90,0.65);
      border-color: rgba(0,240,130,0.85);
    }
    #legend {
      margin-left: auto;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }
    #save-status {
      font-size: 12px;
      color: rgba(100,255,150,0.9);
      min-width: 100px;
    }
    .sep {
      width: 1px; height: 22px;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="map-konva-container"></div>

  <div id="planner-panel">
    <a href="/control.html"
       style="color:rgba(255,255,255,0.55);font-size:13px;text-decoration:none;white-space:nowrap;">
      ← Control Panel
    </a>
    <div class="sep"></div>

    <button id="btn-start"    class="mode-btn" onclick="setMode('start')">📍 Set Start</button>
    <button id="btn-waypoint" class="mode-btn active" onclick="setMode('waypoint')">➕ Add Waypoint</button>

    <div class="sep"></div>

    <button class="mode-btn" onclick="undoLast()">↩ Undo</button>
    <button class="mode-btn" onclick="clearAll()">🗑 Clear All</button>

    <div class="sep"></div>

    <button class="mode-btn"
            style="background:rgba(0,70,180,0.6);border-color:rgba(80,150,255,0.8);"
            onclick="saveMission()">💾 Save Mission</button>
    <span id="save-status"></span>

    <div id="legend">
      <span style="color:#00ff88">● Start</span> &nbsp;|&nbsp;
      <span style="color:#00ccff">● Waypoints</span> &nbsp;|&nbsp;
      <span style="color:rgba(255,100,0,0.9)">● Robot</span>
    </div>
  </div>

  <div id="controls">
    <b>Click map</b>: add point &nbsp;|&nbsp;
    <b>Click point</b>: remove &nbsp;|&nbsp;
    <b>Scroll</b>: zoom &nbsp;|&nbsp;
    <b>Drag</b>: pan
  </div>

  <script src="path_plan.js"></script>
</body>
</html>
