# Robot Control Configuration
robot:
  linear_speed: 1.0
  angular_speed: 0.5
  max_linear_speed: 1.5
  min_linear_speed: 0.1
  max_angular_speed: 1.0
  min_angular_speed: 0.1

# PTZ Camera Settings
ptz:
  pan_min: -468000
  pan_max: 468000
  tilt_min: -324000
  tilt_max: 324000
  zoom_min: 0
  zoom_max: 100
  pan_step: 18000  # 3600 * 5
  tilt_step: 14400  # 7200 * 2
  zoom_step: 10

# Server Settings
server:
  host: '0.0.0.0'
  port: 8000
  ping_interval: 5
  ping_timeout: 10
  max_http_buffer_size: 10000000  

# ROS2 Settings
ros2:
  cmd_vel_topic: '/cmd_vel'
  rgb_topic: '/rgb'
  node_name: 'web_control_node'

# File Paths
paths:
  map_dir: '~/box/vln-large-scale-farm/cartographer_ws/output'
  data_dir: '~/box/vln-large-scale-farm/data'
  zed_tools: '~/box/vln-large-scale-farm/tools_zed'
  livox_config: '~/box/vln-large-scale-farm/cartographer_ws/src/livox_ros_driver2/config/mid360_config.json'

# Map Settings
map:
  default_resolution: 0.05
  update_interval: 5  # seconds

# Autonomous Driving
autonomous:
  max_repeat_num: 3
  min_waypoints: 2

# Image Settings
image:
  jpeg_quality: 80
  frame_save_interval: 2.0  # seconds

# System Monitor
monitor:
  update_interval: 1.0  # seconds