# File Paths
paths:
  map_dir: '~/box/vln-large-scale-farm/fast_lio_ws/output'
  data_dir: '~/box/vln-large-scale-farm/data'

# Robot Control Configuration
robot:
  linear_speed: 1.0
  angular_speed: 0.5
  max_linear_speed: 1.5
  min_linear_speed: 0.1
  max_angular_speed: 1.0
  min_angular_speed: 0.1

# Recording Settings
recording:
  zed_hz: 30  # ZED RGB/Depth recording frequency
  lidar_hz: 10  # LiDAR records at sensor rate (~10Hz)
  imu_hz: 100  # IMU records at sensor rate (~100Hz)
  pairing_threshold_ms: 50  # Timestamp pairing threshold
  web_stream_hz: 10  # Web streaming frequency
  sample_interval_sec: 300

# Server Settings
server:
  host: '0.0.0.0'
  port: 8000
  ping_interval: 5
  ping_timeout: 10
  max_http_buffer_size: 10000000

# ROS2 Settings
ros2:
  cmd_vel_topic: '/cmd_vel'
  node_name: 'web_control_node'

# Autonomous Driving
autonomous:
  max_repeat_num: 3
  min_waypoints: 2

# System Monitor
monitor:
  update_interval: 0.25

map:
  update_interval: 0.5